name: Validar

on:
  push:
    paths:
      - "schedule.json"
      - "publish.py"
      - "tests/**"
      - "videos/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests (Meta simulado + videos reales)
        run: python -m unittest discover -s tests -v
      - name: Dry-run del próximo Reel (video y URL pública)
        env:
          URL_WAIT: "600"
        run: python publish.py --dry-run --force --no-wait
      - name: Chequeo del token (whoami)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "::error::Falta el secreto IG_ACCESS_TOKEN"; exit 1; fi
          python publish.py --whoami
