<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Conexión con TikTok</title></head>
<body style="font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.5;background:#fff;color:#222">
<h1>Conexión con TikTok</h1>
<div id="ok" hidden>
  <p>TikTok autorizó la conexión. Copiá este código y pegalo en la ventana de la computadora que te lo pidió (no lo mandes a nadie más):</p>
  <textarea id="codigo" readonly rows="4" style="width:100%;font-size:16px"></textarea>
  <p><button id="copiar" style="font-size:18px;padding:10px 18px">Copiar código</button> <span id="hecho"></span></p>
</div>
<p id="error" hidden style="color:#b3261e"></p>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get("code")) {
    document.getElementById("ok").hidden = false;
    document.getElementById("codigo").value = p.get("code");
    document.getElementById("copiar").onclick = async () => {
      try { await navigator.clipboard.writeText(p.get("code")); } catch (e) { document.getElementById("codigo").select(); document.execCommand("copy"); }
      document.getElementById("hecho").textContent = "¡Copiado!";
    };
  } else {
    const e = document.getElementById("error");
    e.hidden = false;
    e.textContent = "No llegó ningún código. " + (p.get("error_description") || p.get("error") || "Probá de nuevo desde la computadora.");
  }
</script>
</body>
</html>
